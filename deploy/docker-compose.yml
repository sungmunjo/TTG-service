# 서비스 서버(EC2 #2)의 /opt/ttg 에 복사되어 실행된다.
# 이미지 태그와 비밀값은 같은 폴더의 .env 에서 읽는다 (.env.example 참고).
services:
  api:
    image: ${ECR_REGISTRY}/ttg-service:${API_TAG}
    restart: unless-stopped
    environment:
      # DB 는 RDS 로 분리했다. 주소(엔드포인트)는 .env 의 DB_HOST 에서 읽는다
      DB_URL: jdbc:postgresql://${DB_HOST:?DB_HOST is not set in .env}:5432/ttg_database
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # 업로드 파일은 S3 버킷에 저장한다. 키는 비워두면 앱 서버의 IAM 역할(ttg-app-role)로 접속한다
      STORAGE_ENDPOINT: https://s3.us-east-1.amazonaws.com
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: ${STORAGE_BUCKET:?STORAGE_BUCKET is not set in .env}
      STORAGE_ACCESS_KEY: ""
      STORAGE_SECRET_KEY: ""

  ui:
    image: ${ECR_REGISTRY}/ttg-ui:${UI_TAG}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - ui
