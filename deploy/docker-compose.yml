# 서비스 서버(EC2 #2)의 /opt/ttg 에 복사되어 실행된다.
# 이미지 태그와 비밀값은 같은 폴더의 .env 에서 읽는다 (.env.example 참고).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ttg_database
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ttg_database"]
      interval: 5s
      retries: 10

  api:
    image: ${ECR_REGISTRY}/ttg-service:${API_TAG}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/ttg_database
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  ui:
    image: ${ECR_REGISTRY}/ttg-ui:${UI_TAG}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - ui

volumes:
  db-data:
