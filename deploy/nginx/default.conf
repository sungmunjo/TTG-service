# 브라우저는 nginx 하나(80포트)만 본다.
# /v1, /api, swagger 는 Spring(api)으로, 나머지는 Next.js(ui)로 보낸다.
# 같은 출처라서 CORS 설정 없이도 UI가 API를 호출할 수 있다.
# Host 는 포트까지 넘겨야($http_host) Spring 이 같은 출처로 판단한다 ($host 를 쓰면 POST 가 "Invalid CORS request" 403).
server {
    listen 80;
    server_name _;

    location ~ ^/(v1|api|swagger-ui|v3/api-docs)(/|$) {
        proxy_pass http://api:20301;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://ui:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
